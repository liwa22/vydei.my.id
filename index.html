<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>VIDEO.TWIMG - Premium Video Streaming</title>

  <script type="text/javascript">
      (function (l) {
        if (l.hash && l.hash.startsWith('#/')) {
          const newPath = l.hash.replace('#', '');
          window.location.replace(newPath);
        }
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #09090b;
      color: #fafafa;
    }

    header {
      backdrop-filter: blur(12px);
      background-color: rgba(9, 9, 11, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    #video-container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background-color: #000;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    #video-player {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      outline: none;
      background-color: #000;
    }

    .loading-spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -25px;
      margin-left: -25px;
      z-index: 20;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .btn-gradient {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      transition: all 0.3s ease;
    }
    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="sticky top-0 z-50 px-6 py-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
          <i class="fas fa-play text-white text-xs"></i>
        </div>
        <h1 class="text-xl font-bold tracking-tight uppercase">
          VIDEO<span class="text-blue-500">.TWIMG</span>
        </h1>
      </div>
      <nav>
        <a href="https://videi.my.id/" class="btn-gradient text-white text-sm px-5 py-2.5 rounded-full font-semibold flex items-center">
          <i class="fas fa-cloud-upload-alt mr-2"></i> Upload
        </a>
      </nav>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-grow py-8 px-4 md:px-6">
    <div class="max-w-6xl mx-auto">
      <div id="video-container">
        <div class="loading-spinner" id="loading-spinner"></div>
        <video 
          id="video-player" 
          controls 
          preload="auto"
          poster=""
          controlsList="nodownload noremoteplayback" 
          disablePictureInPicture>
          Browser Anda tidak mendukung video.
        </video>
      </div>

      <div id="error-message" class="hidden mt-6 p-4 bg-red-900/20 border border-red-500/50 text-red-400 rounded-xl text-center">
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span id="error-text"></span>
      </div>

      <section class="mt-8">
        <div class="flex flex-col md:flex-row gap-6">
          <div class="flex-1">
            <h2 id="video-title" class="text-2xl md:text-3xl font-bold mb-2">Memuat Judul...</h2>
            <p id="video-description" class="text-zinc-400">
              Memuat deskripsi video...
            </p>
          </div>

          <div class="min-w-[200px]">
            <button id="share-button" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white py-3 px-6 rounded-xl">
              <i class="fas fa-share-nodes mr-2"></i> Salin Link
            </button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="border-t border-zinc-900 py-8 px-6 text-center">
    <p class="text-zinc-500 text-sm">
      © 2026 <span class="text-zinc-300 font-semibold">VIDEO.TWIMG</span>. All rights reserved.
    </p>
  </footer>

  <!-- SCRIPT -->
  <script>
    const videoPlayer = document.getElementById('video-player');

    document.addEventListener('DOMContentLoaded', async () => {
      let videoId = location.pathname.replace('/', '');

      const titleEl = document.getElementById('video-title');
      const descEl = document.getElementById('video-description');
      const spinner = document.getElementById('loading-spinner');
      const errorBox = document.getElementById('error-message');
      const errorText = document.getElementById('error-text');
      const shareBtn = document.getElementById('share-button');

      spinner.style.display = 'block';

      try {
        const res = await axios.get('https://raw.githubusercontent.com/liwa22/json/refs/heads/main/Video.json');
        const data = res.data.find(v => v.id === videoId);

        if (!data) throw 'Video tidak ditemukan';

        videoPlayer.src = data.Url + '#t=1';
        titleEl.textContent = data.Judul || 'Untitled';
        descEl.textContent = data.Description || '-';
        videoPlayer.load();

      } catch (e) {
        errorText.textContent = e;
        errorBox.classList.remove('hidden');
      } finally {
        spinner.style.display = 'none';
      }

      shareBtn.onclick = async () => {
        await navigator.clipboard.writeText(location.href);
        shareBtn.innerHTML = '✔ Disalin';
        setTimeout(() => shareBtn.innerHTML = 'Salin Link', 1500);
      };
    });

    videoPlayer.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
